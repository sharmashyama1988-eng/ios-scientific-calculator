<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>iOS Scientific Calculator</title>

<style>
:root{
    --bg:#000000;
    --num:#333333;
    --func:#A5A5A5;
    --op:#FF9500;

    --white:#FFFFFF;
    --black:#000000;

    --card:#111111;
    --glass:rgba(255,255,255,0.05);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    padding:20px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #2d2d2d,
            #111111 35%,
            #000000 100%
        );

    color:white;
}

.layout{
    max-width:1100px;
    margin:auto;

    display:grid;
    gap:25px;
}

.calculator{
    background:var(--bg);

    border-radius:40px;

    padding:24px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.60),
        inset 0 1px 0 rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.05);
}

.display{
    min-height:100px;

    display:flex;
    align-items:flex-end;
    justify-content:flex-end;

    text-align:right;

    font-size:clamp(3rem,8vw,5rem);

    font-weight:200;

    letter-spacing:-2px;

    color:white;

    overflow:hidden;

    margin-bottom:20px;

    padding:10px;
}

.sci-grid{
    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:10px;

    margin-bottom:12px;
}

.grid{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:10px;
}

button{
    position:relative;

    overflow:hidden;

    border:none;

    border-radius:999px;

    height:78px;

    cursor:pointer;

    color:white;

    font-size:1.4rem;

    font-weight:500;

    transition:
        transform .12s ease,
        filter .20s ease,
        box-shadow .20s ease;
}

button:hover{
    transform:translateY(-2px);
    filter:brightness(1.1);
}

button:active{
    transform:scale(.92);
}

button::after{
    content:"";

    position:absolute;

    inset:0;

    background:rgba(255,255,255,.15);

    opacity:0;

    transition:.15s;
}

button:active::after{
    opacity:1;
}

.number{
    background:#333333;

    color:#FFFFFF;

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.06),
        0 4px 12px rgba(0,0,0,.35);
}

.number:hover{
    background:#444444;
}

.function{
    background:#A5A5A5;

    color:#000000;

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.25),
        0 4px 12px rgba(0,0,0,.20);
}

.function:hover{
    background:#bdbdbd;
}

.operator{
    background:#FF9500;

    color:white;

    box-shadow:
        0 6px 16px rgba(255,149,0,.35),
        inset 0 1px 1px rgba(255,255,255,.20);
}

.operator:hover{
    box-shadow:
        0 12px 30px rgba(255,149,0,.55),
        inset 0 1px 1px rgba(255,255,255,.20);
}

.equals{
    animation:pulseOrange 2s infinite;
}

@keyframes pulseOrange{

    0%{
        box-shadow:
            0 0 0 rgba(255,149,0,.4);
    }

    50%{
        box-shadow:
            0 0 30px rgba(255,149,0,.8);
    }

    100%{
        box-shadow:
            0 0 0 rgba(255,149,0,.4);
    }
}

.zero{
    grid-column:span 2;

    text-align:left;

    padding-left:32px;
}

.history{
    background:rgba(255,255,255,.05);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.08);

    border-radius:28px;

    padding:20px;

    box-shadow:
        0 8px 32px rgba(0,0,0,.3);
}

.history-title{
    color:#bdbdbd;

    margin-bottom:15px;

    font-size:1rem;

    font-weight:600;
}

.history-item{
    background:#1A1A1A;

    border-radius:14px;

    padding:14px;

    margin-bottom:10px;

    cursor:pointer;

    transition:.2s;

    animation:historyEnter .3s ease;
}

.history-item:hover{
    background:#2A2A2A;
}

@keyframes historyEnter{

    from{
        opacity:0;
        transform:translateX(18px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

#clearHistory{
    width:100%;

    margin-bottom:15px;

    height:50px;
}

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-thumb{
    background:#444;
    border-radius:20px;
}

@media(max-width:900px){

    .layout{
        display:flex;
        flex-direction:column;
    }

    .calculator{
        order:1;
    }

    .history{
        order:2;
    }
}

@media(max-width:600px){

    .sci-grid{
        grid-template-columns:repeat(3,1fr);
    }

    button{
        height:68px;
        font-size:1.1rem;
    }

    .display{
        font-size:3rem;
    }
}
</style>
</head>

<body>

<div class="layout">

<div class="calculator">

<div class="display" id="display">0</div>

<div class="sci-grid">

<button class="function">sin</button>
<button class="function">cos</button>
<button class="function">tan</button>
<button class="function">log</button>
<button class="function">ln</button>

<button class="function">√</button>
<button class="function">x²</button>
<button class="function">π</button>
<button class="function">%</button>
<button class="function">+/-</button>

</div>

<div class="grid">

<button class="function">AC</button>
<button class="function">(</button>
<button class="function">)</button>
<button class="operator">÷</button>

<button class="number">7</button>
<button class="number">8</button>
<button class="number">9</button>
<button class="operator">×</button>

<button class="number">4</button>
<button class="number">5</button>
<button class="number">6</button>
<button class="operator equals">=</button>

<button class="number">1</button>
<button class="number">2</button>
<button class="number">3</button>
<button class="operator">+</button>

<button class="number zero">0</button>
<button class="number">.</button>
<button class="operator">=</button>

</div>

</div>

<div class="history">

<h3 class="history-title">Calculation History</h3>

<button class="function" id="clearHistory" style="width:100%;margin-bottom:15px">
Clear History
</button>

<div id="historyList"></div>

</div>

</div>

<script>

const display = document.getElementById("display");
const historyList = document.getElementById("historyList");

let expression = "";

loadHistory();

function updateDisplay(value){
  display.textContent = value;
}

function saveHistory(text){
  const history =
    JSON.parse(localStorage.getItem("calc-history") || "[]");

  history.unshift(text);

  localStorage.setItem(
    "calc-history",
    JSON.stringify(history.slice(0,50))
  );

  loadHistory();
}

function loadHistory(){

  const history =
    JSON.parse(localStorage.getItem("calc-history") || "[]");

  historyList.innerHTML = "";

  history.forEach(item=>{
    const div=document.createElement("div");

    div.className="history-item";

    div.textContent=item;

    div.onclick=()=>{
      const result=item.split(" = ")[1];
      expression=result;
      updateDisplay(result);
    };

    historyList.appendChild(div);
  });
}

function evaluateExpression(){

  try{

    const jsExp = expression
      .replace(/÷/g,"/")
      .replace(/×/g,"*")
      .replace(/−/g,"-");

    const result = eval(jsExp);

    saveHistory(expression + " = " + result);

    expression = String(result);

    updateDisplay(result);

  }
  catch{
    updateDisplay("Error");
    expression="";
  }
}

document
.querySelectorAll("button")
.forEach(btn=>{

  btn.addEventListener("click",()=>{

    const key = btn.textContent;

    if(key==="Clear History"){
      localStorage.removeItem("calc-history");
      loadHistory();
      return;
    }

    if(key==="AC"){
      expression="";
      updateDisplay("0");
      return;
    }

    if(key==="="){
      evaluateExpression();
      return;
    }

    if(key==="π"){
      expression += Math.PI;
      updateDisplay(expression);
      return;
    }

    if(key==="+/-"){
      expression = String(-(parseFloat(expression)||0));
      updateDisplay(expression);
      return;
    }

    if(key==="%"){
      expression = String((parseFloat(expression)||0)/100);
      updateDisplay(expression);
      return;
    }

    if(key==="sin"){
      expression = String(
        Math.sin((parseFloat(expression)||0)*Math.PI/180)
      );
      updateDisplay(expression);
      return;
    }

    if(key==="cos"){
      expression = String(
        Math.cos((parseFloat(expression)||0)*Math.PI/180)
      );
      updateDisplay(expression);
      return;
    }

    if(key==="tan"){
      expression = String(
        Math.tan((parseFloat(expression)||0)*Math.PI/180)
      );
      updateDisplay(expression);
      return;
    }

    if(key==="√"){
      expression = String(
        Math.sqrt(parseFloat(expression)||0)
      );
      updateDisplay(expression);
      return;
    }

    if(key==="x²"){
      const n=parseFloat(expression)||0;
      expression = String(n*n);
      updateDisplay(expression);
      return;
    }

    if(key==="log"){
      expression = String(
        Math.log10(parseFloat(expression)||1)
      );
      updateDisplay(expression);
      return;
    }

    if(key==="ln"){
      expression = String(
        Math.log(parseFloat(expression)||1)
      );
      updateDisplay(expression);
      return;
    }

    expression += key;
    updateDisplay(expression);

  });

});

</script>

</body>
</html>
